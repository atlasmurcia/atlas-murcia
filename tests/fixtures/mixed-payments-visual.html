<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba visual · Pago mixto Murcia</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef4f7;color:#173042;font:15px Inter,system-ui,Arial;padding:32px}.modal{max-width:920px;margin:auto;background:#fff;border-radius:18px;padding:24px;box-shadow:0 24px 70px #21495b2b}.head{display:flex;justify-content:space-between;gap:16px;align-items:start}.head h1{margin:0;font-size:24px}.small{color:#667985;font-size:13px}.callout{background:#eaf6fb;border:1px solid #c8e8f3;border-radius:10px;padding:13px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px;font-size:13px;font-weight:700}.field input,.field select{width:100%;border:1px solid #b8cbd5;border-radius:8px;padding:10px;background:#fff;font:inherit}.field.full{grid-column:1/-1}.actions{display:flex;align-items:center;gap:10px;margin-top:18px}.actions span{flex:1}button{border:1px solid #c7d6dd;background:#fff;border-radius:9px;padding:10px 14px;font-weight:800}.primary{background:#0b7fab;color:#fff;border-color:#0b7fab}@media(max-width:650px){body{padding:12px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
