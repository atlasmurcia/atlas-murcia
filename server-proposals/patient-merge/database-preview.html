<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATLAS Murcia · Fusión en PostgreSQL de pruebas</title>
<link rel="stylesheet" href="patient-merge.css"><style>body{font:15px system-ui;background:#f1f5f8;color:#173747;margin:0}header{padding:20px 5%;background:white;border-bottom:1px solid #d5e3e9}main{max-width:1120px;margin:25px auto;background:white;padding:24px;border:1px solid #d5e3e9;border-radius:14px}.notice{padding:14px;background:#fff4d5;border:1px solid #e4c66d;border-radius:9px;margin-bottom:22px}a{color:#087da2}@media(max-width:680px){main{margin:8px;padding:15px}}</style>
<header><b>ATLAS CLINIC</b> · Murcia · Entorno aislado</header><main><div class="notice"><b>Solo pacientes ficticios.</b> Esta pantalla utiliza una base de datos PostgreSQL local de pruebas. La fusión cambia realmente las asociaciones en esa base de pruebas. No está conectada a la clínica.</div><div id="merge"></div></main>
<script src="merge-controller.js"></script><script src="patient-merge-panel.js"></script><script>
fetch('/scope').then(r=>r.json()).then(scope=>mountPatientMerge(document.getElementById('merge'),{scope,request:async(action,payload)=>{const r=await fetch('/rpc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,payload})});const result=await r.json();if(!r.ok)throw Object.assign(Error(result.error),{code:result.code});return result;}})).catch(e=>{document.getElementById('merge').textContent=e.message;});
</script></html>
