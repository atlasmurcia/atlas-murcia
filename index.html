<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Cache-Control" content="no-store"><title>ATLAS Murcia</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#edf8fc;color:#344954;font:16px system-ui}main{max-width:420px;text-align:center;padding:28px}h1{color:#0b7fab}button{background:#00b0e4;color:#fff;border:0;border-radius:10px;padding:12px 20px;cursor:pointer}</style></head><body><main><h1>ATLAS Murcia</h1><p id="status" role="status">Abriendo Atlas…</p><button id="retry" hidden onclick="location.reload()">Volver a intentar</button></main><script>
(async()=>{try{const response=await fetch('./atlas.html?load='+Date.now(),{cache:'no-store',credentials:'same-origin'});if(!response.ok)throw new Error('No se pudo cargar Atlas');const html=await response.text();if(!html.includes('atlasLoginForm'))throw new Error('La sesión de acceso ha caducado');document.open();document.write(html);document.close()}catch(error){document.getElementById('status').textContent='No se ha podido abrir Atlas. Comprueba tu conexión y vuelve a intentarlo.';document.getElementById('retry').hidden=false;console.error(error)}})();
</script></body></html>
